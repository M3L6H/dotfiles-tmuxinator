# /home/m3l6h/.config/tmuxinator/sessionx.yml
name: sessionx
root: ~/files/dev/omerxx/tmux-sessionx/
on_project_start:
  - cp /home/$USER/.zsh_history /persist/home/$USER/.zsh_history
  - cp /persist/home/$USER/.zsh_history-sessionx /home/$USER/.zsh_history
  - cp /home/$USER/.local/state/nvim/shada/main.shada /persist/home/$USER/.local/state/nvim/shada/main.shada
  - cp /persist/home/$USER/.local/state/nvim/shada/main.shada-sessionx /home/$USER/.local/state/nvim/shada/main.shada
on_project_exit:
  - mv /home/$USER/.zsh_history /persist/home/$USER/.zsh_history-sessionx
  - cp /persist/home/$USER/.zsh_history /home/$USER/.zsh_history
  - mv /home/$USER/.local/state/nvim/shada/main.shada /persist/home/$USER/.local/state/nvim/shada/main.shada-sessionx
  - cp /persist/home/$USER/.local/state/nvim/shada/main.shada /home/$USER/.local/state/nvim/shada/main.shada
pre_window:
  - export NEOVIM_SOCKET='/tmp/nvimsocket-sessionx'
  - tmux setenv NEOVIM_SOCKET $NEOVIM_SOCKET
  - clear
windows:
  # Enable controlling neovim with neovim-remote
  - neovim: nvim --listen /tmp/nvimsocket-sessionx
  - term:
      - git fetch && clear
